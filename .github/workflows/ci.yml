name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run --testTimeout=60000
      - run: npm run build
        env:
          AI_PROVIDER: dummy

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lore
          POSTGRES_USER: lore_test
          POSTGRES_PASSWORD: lore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lore_test -d lore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: detect
        run: echo "present=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - if: steps.detect.outputs.present == 'true'
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: lore
          PGUSER: lore_test
          PGPASSWORD: lore_test_password
          PGSSLMODE: disable
        run: |
          pip install -r requirements-dev.txt
          ruff check . && ruff format --check .
          alembic upgrade head
          pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: false
          tags: lore-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: detect-api
        run: echo "present=$([ -f backend/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect-api.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: false
          tags: lore-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate web compose config
        run: docker compose -f deploy/web/compose.yml config >/dev/null
        env:
          APP_IMAGE: ghcr.io/nnaory/lore-web:ci
          API_UPSTREAM: http://10.20.10.10:8000
      - name: Validate api compose config
        run: |
          docker compose -f deploy/api/compose.yml config >/dev/null
          docker compose -f deploy/api/compose.yml --profile migrate config --services | grep -qx "migrate"
        env:
          APP_IMAGE: ghcr.io/nnaory/lore-api:ci
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/deploy/web/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e API_UPSTREAM=http://10.20.10.10:8000 \
            caddy:2.11.9-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: python3 -B scripts/ci/check-cost-static infra
      - run: python3 -B scripts/ci/test-checkers.py -v
      - run: shellcheck infra/bootstrap/bootstrap.sh scripts/verify/*.sh deploy/common/*.sh scripts/ci/*.sh

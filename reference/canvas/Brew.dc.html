<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>LORE — Membangun dunia: kuali Hazel (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F12}
a{color:#C9A227}a:hover{color:#FF7A18}
button:focus-visible{outline:2px solid #FF7A18;outline-offset:2px}
@keyframes lore-rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}78%{opacity:1}100%{transform:translateY(-220px);opacity:0}}
@keyframes lore-blink{50%{opacity:0}}
.lore-bub{animation:lore-rise 3.2s steps(16) forwards}
.lore-blink{animation:lore-blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.lore-bub{animation:none;opacity:0}.lore-blink{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background-color: #0F0F12; background-image: linear-gradient(rgba(244,239,230,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(244,239,230,0.035) 1px, transparent 1px); background-size: 24px 24px; font-family: 'Space Grotesk', sans-serif; color: #F4EFE6">

  <sc-for list="{{pumpkins}}" as="p" hint-placeholder-count="3">
    <div aria-hidden="true" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px">
      <sc-for list="{{p.layers}}" as="l" hint-placeholder-count="4">
        <pre style="position: absolute; left: 0; top: 0; margin: 0; font-family: 'JetBrains Mono', monospace; font-size: {{p.fs}}px; line-height: {{p.fs}}px; white-space: pre; color: {{l.color}}; opacity: {{l.op}}">{{l.text}}</pre>
      </sc-for>
    </div>
  </sc-for>

  <header style="position: absolute; left: 0; top: 0; width: 1440px; height: 64px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: #0F0F12; border-bottom: 1px solid #2A2A2E">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.4em; color: #C9A227">LORE</span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #FF7A18">MEMBANGUN DUNIAMU</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A8A49C">2611.21885v2.pdf · 63 halaman · fantasi · 3 bab</span>
    </div>
    <span style="width: 120px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700">{{total}}</span>
  </header>

  <!-- rising bubbles: real concepts / world parts as they are found -->
  <div aria-hidden="true" style="position: absolute; left: 380px; top: 160px; width: 400px; height: 260px; pointer-events: none">
    <sc-for list="{{bubbles}}" as="b" hint-placeholder-count="0">
      <span class="lore-bub" style="position: absolute; left: {{b.x}}px; top: 224px; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: {{b.ink}}">( {{b.text}} )</span>
    </sc-for>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 380px; top: 404px">
    <sc-for list="{{pot}}" as="l" hint-placeholder-count="10">
      <pre style="position: absolute; left: 0; top: 0; margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 10px; white-space: pre; color: {{l.color}}; opacity: {{l.op}}">{{l.text}}</pre>
    </sc-for>
  </div>

  <div role="img" aria-label="{{hazelLabel}}" style="position: absolute; left: 110px; top: 186px; width: 264px; height: 480px">
    <sc-for list="{{hazel}}" as="l" hint-placeholder-count="10">
      <pre aria-hidden="true" style="position: absolute; left: 0; top: 0; margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 10px; white-space: pre; color: {{l.color}}; opacity: {{l.op}}">{{l.text}}</pre>
    </sc-for>
  </div>

  <!-- pipeline: steps + log, flat column -->
  <aside aria-label="Tahapan" style="position: absolute; left: 880px; top: 112px; width: 440px; height: 556px; box-sizing: border-box; padding-left: 32px; border-left: 1px solid #2A2A2E; display: flex; flex-direction: column; gap: 14px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #A8A49C">TAHAPAN</span>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <li style="height: 52px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #2A2A2E">
          <span aria-hidden="true" style="position: relative; width: 14px; height: 14px; box-sizing: border-box; background: {{s.fill}}; border: 2px solid {{s.line}}">
            <sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}"><span class="lore-blink" style="position: absolute; inset: 2px; background: {{s.line}}"></span></sc-if>
          </span>
          <span style="flex-grow: 1; font-size: 15px; font-weight: {{s.weight}}; color: {{s.ink}}">{{s.label}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{s.metaInk}}">{{s.meta}}</span>
        </li>
      </sc-for>
    </ol>
    <span style="margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #A8A49C">LOG</span>
    <div role="log" aria-live="polite" style="flex-grow: 1; box-sizing: border-box; padding: 14px 16px; border: 1px solid #2A2A2E; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5">
      <sc-for list="{{log}}" as="g" hint-placeholder-count="6">
        <span style="color: {{g.ink}}; white-space: nowrap">{{g.text}}</span>
      </sc-for>
      <span class="lore-blink" aria-hidden="true" style="width: 8px; height: 14px; background: #FF7A18"></span>
    </div>
  </aside>

  <!-- Hazel talks; on the review step the dialogue becomes the concept checklist -->
  <section aria-label="Hazel" style="position: absolute; left: 110px; top: 700px; width: 1210px; height: 160px; box-sizing: border-box; background: #F4EFE6; border: 3px solid #0F0F12; box-shadow: 0 0 0 2px #F4EFE6; color: #0F0F12; padding: 24px 32px 16px 32px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: absolute; left: 32px; top: -18px; height: 30px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: #0F0F12; border: 2px solid #F4EFE6">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #E0393E">HAZEL</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A8A49C">Witch of the Ember Marsh</span>
    </div>
    <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.55">{{line}}</p>
    <sc-if value="{{review}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
        <div role="group" aria-label="Konsep yang ditemukan" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
            <button onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="height: 34px; padding: 0 12px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; background: {{c.bg}}; color: {{c.ink}}; border: 2px {{c.style}} #0F0F12; text-decoration: {{c.strike}}">{{c.mark}} {{c.text}}</button>
          </sc-for>
        </div>
        <button onClick="{{proceed}}" style="flex-shrink: 0; height: 44px; padding: 0 20px; border: none; background: #FF7A18; color: #0F0F12; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700">{{proceedLabel}}</button>
      </div>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: flex-end; gap: 10px">
        <button onClick="{{restart}}" style="height: 44px; padding: 0 16px; border: 2px solid #0F0F12; background: transparent; color: #0F0F12; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">ulang demo</button>
        <button style="height: 44px; padding: 0 20px; border: none; background: #FF7A18; color: #0F0F12; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700">Masuk ke Valoria →</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["brewing","review"],"default":"brewing"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  lib() {
    if (!this._lib) {
      this._lib = (function () {
// ---- shared ASCII generators (pasted into each artboard script) ----
function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function grid(c, r){ const g = []; for (let i = 0; i < r; i++) g.push(new Array(c).fill(null)); return g; }
function layers(g, spec, mask){
  const out = [];
  if (mask) out.push({ color: mask, op: 1, text: g.map(row => row.map(v => v ? '█' : ' ').join('')).join('\n') });
  Object.keys(spec).forEach(k => {
    const s = spec[k];
    let any = false;
    const text = g.map(row => row.map(v => { if (v === k) { any = true; return s.ch; } return ' '; }).join('')).join('\n');
    if (any) out.push({ color: s.color, op: s.op, text });
  });
  return out;
}
const CREAM = '#F4EFE6', GOLD = '#C9A227', ORANGE = '#FF7A18', INK = '#0F0F12', SMOKE = '#2A2A2E';

// Eldric, Keeper of the Beacon: paper-doll parts on a 44x48 grid (cell aspect 0.6)
function eldric(expr){
  const C = 44, R = 48, g = grid(C, R), A = 0.6, cx = 13.2;
  const put = (c, r, v) => { if (c >= 0 && c < C && r >= 0 && r < R) g[r][c] = v; };
  const each = (fn) => { for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const v = fn(c * A + A / 2, r + 0.5, c, r); if (v) g[r][c] = v; } };
  // robe
  each((x, y) => { if (y < 24 || y > 48) return; const t = (y - 24) / 24; const hw = 8.4 + t * 4.2; const d = Math.abs(x - cx);
    if (d > hw) return; if (d > hw - 0.7) return 'c3'; const fold = Math.abs(Math.sin((x - cx) * 1.15 + y * 0.06)); return fold > 0.93 ? 'c2' : 'c1'; });
  // sleeve + hand reaching to the lantern
  each((x, y) => { const sx = 17.5, sy = 27, ex = 20.6, ey = 33; const t = Math.max(0, Math.min(1, ((x - sx) * (ex - sx) + (y - sy) * (ey - sy)) / ((ex - sx) ** 2 + (ey - sy) ** 2)));
    const px = sx + t * (ex - sx), py = sy + t * (ey - sy); const d = Math.hypot((x - px) / 1, (y - py) / 1.6); if (d < 1.5) return d > 1.05 ? 'c3' : 'c2'; });
  each((x, y) => { if (Math.hypot((x - 20.8) / 1.1, (y - 33.6) / 1.1) < 1) return 'c4'; });
  // beard
  each((x, y) => { if (y < 20 || y > 36) return; const t = (y - 20) / 16; const hw = 4.9 * (1 - t * t * 0.95) ; const off = Math.sin(y * 0.5) * 0.25; const d = Math.abs(x - cx - off);
    if (d > hw) return; const strand = Math.abs(Math.sin((x - cx) * 3.1)); return strand > 0.9 ? 'c4' : 'c5'; });
  // face
  each((x, y) => { if (Math.hypot((x - cx) / 4.3, (y - 18.2) / 4.3) < 1 && y < 22.5) return 'c4'; });
  // hair at the sides
  each((x, y) => { if (y < 14 || y > 23) return; const d = Math.abs(x - cx); if (d > 4.2 && d < 5.9) return 'c3'; });
  // hat (bent tip) + brim + gold band + stars
  each((x, y) => { if (y < 1 || y > 13) return; const t = (y - 1) / 12; const tipx = cx + 3.4 * (1 - t) * (1 - t); const hw = 0.35 + t * 5.6; const d = Math.abs(x - tipx);
    if (d > hw) return; if (y > 10.6 && y < 12.4) return 'g2'; return d > hw - 0.8 ? 'c3' : 'c2'; });
  each((x, y) => { if (Math.hypot((x - cx) / 10.2, (y - 13.6) / 1.25) < 1) return Math.hypot((x - cx) / 10.2, (y - 13.6) / 1.25) > 0.72 ? 'c4' : 'c3'; });
  [[14.6, 4], [11.8, 8], [15.6, 9]].forEach(([x, y]) => put(Math.floor(x / A), y, 'g1'));
  // eyes + brows (expression)
  const eyeY = 18, ex1 = Math.floor((cx - 1.9) / A), ex2 = Math.floor((cx + 1.9) / A);
  [ex1, ex2].forEach(c => { put(c, eyeY, 'o2'); put(c + 1, eyeY, 'o2'); });
  const browY = expr === 'worried' ? 16 : 16;
  if (expr === 'worried') { put(ex1 - 1, browY, 'k'); put(ex1, browY, 'k'); put(ex1 + 1, browY - 1, 'k'); put(ex2, browY - 1, 'k'); put(ex2 + 1, browY, 'k'); put(ex2 + 2, browY, 'k'); }
  else { for (let i = -1; i <= 2; i++) { put(ex1 + i, browY, 'k'); put(ex2 + i - 1, browY, 'k'); } }
  // mouth
  const my = 22, mc = Math.floor(cx / A);
  if (expr === 'smile') { put(mc - 2, my - 1, 'k'); put(mc - 1, my, 'k'); put(mc, my, 'k'); put(mc + 1, my, 'k'); put(mc + 2, my - 1, 'k'); }
  else if (expr === 'worried') { put(mc - 1, my, 'k'); put(mc, my - 0, 'k'); put(mc + 1, my, 'k'); put(mc - 2, my + 1, 'k'); put(mc + 2, my + 1, 'k'); }
  else { for (let i = -1; i <= 1; i++) put(mc + i, my, 'k'); }
  // clasp
  put(Math.floor(cx / A) - 5, 25, 'g2'); put(Math.floor(cx / A) + 5, 25, 'g2');
  // lantern: hook, frame, flame, glow
  each((x, y) => { const lx = 21.2, top = 35, bot = 43; if (y < 34 || y > 44.5) return;
    if (Math.abs(x - lx) < 0.4 && y < 35.5) return 'g1';
    const hw = 2.1 - (y < 36 ? (36 - y) * 0.9 : 0) - (y > 42 ? (y - 42) * 0.7 : 0); const d = Math.abs(x - lx);
    if (y < top || y > bot || d > hw) return; if (d > hw - 0.65 || y < top + 1 || y > bot - 1) return 'g2';
    return Math.hypot((x - lx) / 0.9, (y - 39.2) / 2.3) < 1 ? 'o2' : 'o1'; });
  each((x, y, c, r) => { if (g[r][c]) return; const d = Math.hypot((x - 21.2) / 4.2, (y - 39) / 6.5); if (d < 1 && d > 0.55 && ((c * 7 + r * 3) % 5 === 0)) return 'o3'; });
  return layers(g, {
    c1: { ch: '.', color: CREAM, op: 0.42 }, c2: { ch: ':', color: CREAM, op: 0.6 }, c3: { ch: '+', color: CREAM, op: 0.78 },
    c4: { ch: '#', color: CREAM, op: 0.92 }, c5: { ch: '@', color: CREAM, op: 1 }, k: { ch: '-', color: INK, op: 1 },
    g1: { ch: '*', color: GOLD, op: 1 }, g2: { ch: '#', color: GOLD, op: 1 },
    o1: { ch: '*', color: ORANGE, op: 0.9 }, o2: { ch: '@', color: ORANGE, op: 1 }, o3: { ch: '·', color: ORANGE, op: 0.7 }
  }, INK);
}

// Procedural scene from a recipe: { seed, cols, rows, horizon, beaconCol, moon }
function scene(rec){
  const { cols: C, rows: R } = rec, g = grid(C, R), rnd = rng(rec.seed);
  for (let i = 0; i < C * R * 0.012; i++) { const c = Math.floor(rnd() * C), r = Math.floor(rnd() * rec.horizon * 0.9); g[r][c] = rnd() > 0.85 ? 's2' : 's1'; }
  if (rec.moon) { const [mc, mr, rad] = rec.moon; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const d = Math.hypot((c - mc) * 0.6, r - mr); if (d < rad) g[r][c] = d > rad - 0.9 ? 'm2' : 'm1'; } }
  // skyline of towers
  let c = 0;
  while (c < C) { const w = 3 + Math.floor(rnd() * 7), h = Math.floor(rec.horizon * (0.12 + rnd() * 0.3)); const top = rec.horizon - h; const spire = rnd() > 0.7;
    for (let x = c; x < Math.min(C, c + w); x++) for (let y = top; y < R; y++) g[y][x] = 'b';
    if (spire) { const mid = c + Math.floor(w / 2); for (let y = top - 4; y < top; y++) if (y >= 0 && mid < C) g[y][mid] = 'b'; }
    for (let x = c + 1; x < Math.min(C, c + w - 1); x += 2) for (let y = top + 2; y < rec.horizon + 4; y += 3) if (rnd() > 0.82 && y < R) g[y][x] = 'w';
    c += w + (rnd() > 0.6 ? 1 : 0); }
  // the dying beacon tower
  const bc = rec.beaconCol, btop = Math.floor(rec.horizon * 0.18);
  for (let y = btop; y < R; y++) { const hw = y < btop + 4 ? 1 : 2 + Math.floor((y - btop) / 18); for (let x = bc - hw; x <= bc + hw; x++) if (x >= 0 && x < C) g[y][x] = 't'; }
  for (let y = btop - 3; y < btop; y++) for (let x = bc - 2; x <= bc + 2; x++) if (Math.abs(x - bc) <= 2 - (btop - y - 1)) g[y][x] = 'f';
  for (let r = btop - 8; r < btop + 5; r++) for (let x = bc - 10; x <= bc + 10; x++) { if (r < 0 || x < 0 || x >= C) continue; const d = Math.hypot((x - bc) * 0.6, r - (btop - 2)); if (!g[r][x] && d < 6 && d > 2.2 && rnd() > 0.55) g[r][x] = 'gl'; }
  // gate arch
  const gc = rec.gateCol, gw = 9, gtop = rec.horizon - 6;
  for (let y = gtop; y < R; y++) for (let x = gc - gw; x <= gc + gw; x++) { if (x < 0 || x >= C) continue; const inner = Math.abs(x - gc) < gw - 3 && (y > gtop + 3 + (Math.abs(x - gc) > 3 ? 0 : 0)) ; const arch = Math.hypot((x - gc) * 0.6, (y - (gtop + 6))) < 3.6 || (Math.abs(x - gc) < 6 && y > gtop + 6);
    g[y][x] = arch ? null : 't'; }
  // mist bands
  for (let r = rec.horizon; r < R; r++) for (let x = 0; x < C; x++) if (rnd() > 0.6 && (r % 3 === 0)) g[r][x] = 'mi';
  return layers(g, {
    s1: { ch: '.', color: CREAM, op: 0.28 }, s2: { ch: '+', color: GOLD, op: 0.6 }, m1: { ch: '░', color: CREAM, op: 0.16 }, m2: { ch: '▒', color: CREAM, op: 0.3 },
    b: { ch: '▓', color: SMOKE, op: 1 }, w: { ch: '▪', color: GOLD, op: 0.55 }, t: { ch: '█', color: SMOKE, op: 1 },
    f: { ch: '▲', color: ORANGE, op: 0.75 }, gl: { ch: '·', color: ORANGE, op: 0.45 }, mi: { ch: '~', color: SMOKE, op: 1 }
  });
}

// Jack-o'-lantern: { w, seed }
function pumpkin(w, seed){
  const rnd = rng(seed), R = Math.round(w * 0.42) + 3, C = w + 6, g = grid(C, R), cx = C / 2, cy = R / 2 + 1.2, rx = w / 2, ry = (R - 4) / 2;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const dx = (c + 0.5 - cx) / rx, dy = (r + 0.5 - cy) / ry, d = Math.hypot(dx, dy);
    if (d < 1) { const rib = Math.abs(Math.sin(dx * Math.PI * 2.2)); g[r][c] = rib < 0.18 ? 'pr' : 'pb'; }
    else if (d < 1.35 && (c + r) % 2 === 0 && rnd() > 0.35) g[r][c] = 'h'; }
  // stem
  for (let r = 0; r < Math.max(2, Math.round(cy - ry)); r++) { const c = Math.floor(cx + (r === 0 ? 1 : 0)); g[r][c] = 'st'; }
  // face: triangle eyes + zigzag mouth
  const eyeR = Math.round(cy - ry * 0.25), ew = Math.max(2, Math.round(w * 0.09));
  [-1, 1].forEach(s => { const ec = Math.round(cx + s * w * 0.2); for (let i = 0; i < Math.max(2, Math.round(ew / 1.5)); i++) for (let k = -ew + i; k <= ew - i; k++) { const rr = eyeR - Math.max(2, Math.round(ew / 1.5)) + 1 + i; if (g[rr]) g[rr][ec + k] = 'f'; } });
  const mr = Math.round(cy + ry * 0.35), mw = Math.round(w * 0.3);
  for (let k = -mw; k <= mw; k++) { const c = Math.round(cx + k); g[mr][c] = 'f'; if (Math.abs(k) % 4 < 2 && Math.abs(k) < mw - 1) { if (g[mr + 1]) g[mr + 1][c] = 'f'; } else if (g[mr - 1] && Math.abs(k) < mw) g[mr - 1][c] = 'f'; }
  return layers(g, {
    pb: { ch: '▓', color: ORANGE, op: 0.92 }, pr: { ch: '▒', color: ORANGE, op: 0.5 }, f: { ch: '█', color: '#F2D27A', op: 1 }, st: { ch: '▌', color: GOLD, op: 0.8 }, h: { ch: '·', color: ORANGE, op: 0.35 }
  });
}
// Big jack-o'-lantern whose mouth is a rectangular hole (an input sits behind it)
function jackMouth(w, o){
  const C = w + 4, R = Math.round(w * 0.42) + 4, g = grid(C, R), cx = C / 2, cy = R / 2 + 1.5, rx = w / 2, ry = (R - 5) / 2;

  EYES[x][0].forEach(([dc, dr]) => put(e1 + dc, eyeY + dr, ek)); EYES[x][1].forEach(([dc, dr]) => put(e2 + dc, eyeY + dr, ek));
  if (spec.face !== 'void') {
    BROWS[x][0].forEach(([dc, dr]) => put(e1 + dc, eyeY + dr, spec.browKey || fk)); BROWS[x][1].forEach(([dc, dr]) => put(e2 + dc - 1, eyeY + dr, spec.browKey || fk));
    MOUTH[x].forEach(([dc, dr]) => put(mc + dc, my + dr, fk));
  }
  if (spec.clasp) { put(mc - 5, 25, 'g2'); put(mc + 5, 25, 'g2'); }

  const cloth = spec.cloth || CREAM;
  return layers(g, {
    c1: { ch: '.', color: CREAM, op: 0.42 }, c2: { ch: ':', color: CREAM, op: 0.6 }, c3: { ch: '+', color: CREAM, op: 0.78 },
    c4: { ch: '#', color: CREAM, op: 0.92 }, c5: { ch: '@', color: CREAM, op: 1 }, k: { ch: '-', color: INK, op: 1 },
    u1: { ch: '.', color: cloth, op: 0.6 }, u2: { ch: ':', color: cloth, op: 0.8 }, u3: { ch: '+', color: cloth, op: 0.95 }, u4: { ch: '#', color: cloth, op: 1 },
    g1: { ch: '*', color: GOLD, op: 1 }, g2: { ch: '#', color: GOLD, op: 1 }, g3: { ch: '|', color: GOLD, op: 1 }, g4: { ch: '\\', color: GOLD, op: 1 }, g5: { ch: ';', color: GOLD, op: 0.85 },
    o1: { ch: '*', color: ORANGE, op: 0.9 }, o2: { ch: '@', color: ORANGE, op: 1 }, o3: { ch: '·', color: ORANGE, op: 0.75 }, o4: { ch: '=', color: ORANGE, op: 0.95 }
  }, INK);
}
const CAST = {
  eldric: { cloth: '#6F86D9', outfit: 'robe', prop: 'lantern', beard: 'long', hair: 'sides', hat: 'pointed', eyes: 'o2', clasp: true },
  mira: { cloth: '#7DA868', outfit: 'coat', prop: 'book', hair: 'buns', faceR: 4.0, faceTall: 1.12, eyes: 'k', mouthY: 21, blush: true },
  varr: { cloth: '#3FA79C', outfit: 'armor', prop: 'spear', beard: 'mustache', hat: 'helmet', faceR: 4.4, faceTall: 1.15, eyes: 'k', mouthY: 22 },
  hazel: { cloth: '#E0393E', outfit: 'dress', prop: 'broom', hair: 'long', hat: 'witch', faceR: 4.1, faceTall: 1.1, eyes: 'g2', mouthY: 21, blush: true },
  nyx: { cloth: '#9A6BD6', outfit: 'cloak', prop: 'orb', hat: 'hood', face: 'void', eyes: 'o2' }
};

        return { eldric: eldric, scene: scene, pumpkin: pumpkin, figure: figure, CAST: CAST, jackMouth: jackMouth, wordmark: wordmark, cauldron: cauldron };
      })();
    }
    return this._lib;
  }

  data() {
    if (!this._d) this._d = {
      concepts: ['vektor', 'besaran', 'arah', 'vektor baris', 'vektor kolom', 'panjang vektor', 'penjumlahan vektor', 'perkalian skalar'],
      world: ['Valoria', 'Kuil Langit', 'Arion · pemandu', 'Lyra · rekan', 'Varr · penjaga', 'Nyx · rival'],
      chapters: ['Bab 1 · Segel Dasar', 'Bab 2 · Gerbang Arah', 'Bab 3 · Penyelamatan Valoria']
    };
    return this._d;
  }

  initial() {
    const review = (this.props.start || 'brewing') === 'review';
    return { f: 0, step: review ? 2 : 1, st: 0, times: review ? [8, 0, 0, 0] : [0, 0, 0, 0], drop: [] };
  }

  componentDidMount() {
    this.setState(this.initial());
    this._iv = setInterval(() => {
      this.setState(s => {
        if (!s || s.step === undefined) return null;
        const n = { f: s.f + 1 };
        if (s.step === 1 || s.step === 3 || s.step === 4) {
          const lim = s.step === 1 ? 32 : 26;
          const times = s.times.slice(); times[s.step - 1] = Math.floor((s.st + 1) / 4);
          n.times = times;
          if (s.st + 1 >= lim) { n.step = s.step + 1; n.st = 0; } else n.st = s.st + 1;
        }
        return n;
      });
    }, 250);
  }

  componentWillUnmount() { clearInterval(this._iv); }

  renderVals() {
    const L = this.lib();
    const D = this.data();
    const S = (this.state && this.state.step !== undefined) ? this.state : this.initial();
    if (!this._pf) {
      this._pf = [0, 1, 2, 3].map(i => L.cauldron(i));
      this._hz = {};
      this._p = [{ x: 1200, y: 720, fs: 8, w: 22, seed: 9 }, { x: -40, y: 90, fs: 8, w: 20, seed: 3 }, { x: 760, y: 120, fs: 6, w: 14, seed: 5 }]
        .map(p => ({ x: p.x, y: p.y, fs: p.fs, layers: L.pumpkin(p.w, p.seed) }));
    }
    const step = S.step;
    const found = step === 1 ? Math.min(D.concepts.length, Math.floor((S.st - 2) / 3.6) + 1) : D.concepts.length;
    const nFound = Math.max(0, found);
    const worldN = step < 3 ? 0 : step === 3 ? Math.min(D.world.length, Math.floor(S.st / 4) + 1) : D.world.length;
    const chapN = step < 4 ? 0 : step === 4 ? Math.min(D.chapters.length, Math.floor(S.st / 8) + 1) : D.chapters.length;
    const kept = D.concepts.filter(c => S.drop.indexOf(c) < 0);

    const xs = [20, 150, 70, 210, 40, 180, 110, 230, 10, 160];
    const bubbles = [];
    if (step >= 1 && (this.props.start || 'brewing') !== 'review') for (let i = 0; i < nFound; i++) bubbles.push({ text: D.concepts[i], x: xs[i % xs.length], ink: '#F2D27A' });
    for (let i = 0; i < worldN; i++) bubbles.push({ text: D.world[i], x: xs[(i + 3) % xs.length], ink: '#F4EFE6' });
    for (let i = 0; i < chapN; i++) bubbles.push({ text: D.chapters[i], x: [30, 90, 10][i], ink: '#FF7A18' });

    const expr = step === 2 ? 'smile' : step === 5 ? 'smile' : step === 4 ? 'surprised' : 'calm';
    if (!this._hz[expr]) this._hz[expr] = L.figure(L.CAST.hazel, expr);

    const fmt = (sec) => '00:' + String(sec).padStart(2, '0');
    const labels = ['Membaca materimu', 'Kau periksa konsepnya', 'Merancang dunia & karakter', 'Menulis cerita'];
    const steps = labels.map((lab, i) => {
      const n = i + 1, isDone = step > n, isAct = step === n;
      const waiting = isAct && n === 2;
      return {
        label: lab, active: isAct && !waiting,
        fill: isDone ? '#FF7A18' : 'transparent', line: isDone ? '#FF7A18' : (isAct ? (waiting ? '#C9A227' : '#FF7A18') : '#2A2A2E'),
        ink: isDone || isAct ? '#F4EFE6' : '#A8A49C', weight: isAct ? 700 : 500,
        meta: waiting ? 'menunggumu' : (n === 2 ? (isDone ? kept.length + ' konsep' : '') : (isDone || isAct ? fmt(S.times[i]) : '')),
        metaInk: waiting ? '#C9A227' : '#A8A49C'
      };
    });

    const log = [{ text: 'lore › membaca 2611.21885v2.pdf · 63 hlm', ink: '#A8A49C' }];
    for (let i = 0; i < nFound; i++) log.push({ text: '  + konsep  ' + D.concepts[i], ink: S.drop.indexOf(D.concepts[i]) >= 0 ? '#5A5650' : '#F2D27A' });
    if (step >= 2) log.push({ text: step === 2 ? 'lore › menunggu pemeriksaanmu…' : 'lore › ' + kept.length + ' konsep disetujui', ink: step === 2 ? '#C9A227' : '#A8A49C' });
    for (let i = 0; i < worldN; i++) log.push({ text: (i < 2 ? '  + dunia   ' : '  + tokoh   ') + D.world[i], ink: '#F4EFE6' });
    for (let i = 0; i < chapN; i++) log.push({ text: '  + menulis ' + D.chapters[i], ink: '#FF7A18' });
    if (step === 5) log.push({ text: 'lore › selesai · 3 bab · 4 tokoh', ink: '#C9A227' });

    const lines = {
      1: '“Enam puluh tiga halaman… biar kuaduk pelan-pelan. Setiap gelembung yang naik adalah konsep dari materimu.”',
      2: '“Ini bahan yang kutemukan. Buang yang tak perlu, lalu biarkan aku melanjutkan ramuannya.”',
      3: '“Sekarang dunianya: sejumput kabut, satu kuil di langit, dan beberapa wajah yang akan menemanimu.”',
      4: '“Tinggal ceritanya. Jangan mengintip dulu!”',
      5: '“Selesai! Duniamu siap dijelajahi. Hati-hati dengan Nyx.”'
    };
    const chips = D.concepts.map(c => {
      const on = S.drop.indexOf(c) < 0;
      return { text: c, on: on ? 'true' : 'false', mark: on ? '✓' : '+', bg: on ? '#0F0F12' : 'transparent', ink: on ? '#F4EFE6' : '#5A5650', style: on ? 'solid' : 'dashed', strike: on ? 'none' : 'line-through',
        toggle: () => this.setState(s => ({ drop: on ? s.drop.concat([c]) : s.drop.filter(x => x !== c) })) };
    });
    const total = S.times.reduce((a, b) => a + b, 0);
    return {
      pumpkins: this._p, pot: this._pf[S.f % 4], hazel: this._hz[expr], hazelLabel: 'Hazel mengaduk kuali, ' + expr,
      bubbles: bubbles, steps: steps, log: log.slice(-11), line: lines[step],
      review: step === 2, done: step === 5, chips: chips,
      proceedLabel: 'Aduk lagi · ' + kept.length + ' konsep →',
      proceed: () => this.setState({ step: 3, st: 0 }),
      restart: () => this.setState({ step: 1, st: 0, times: [0, 0, 0, 0], drop: [] }),
      total: fmt(total)
    };
  }
}
</script>
